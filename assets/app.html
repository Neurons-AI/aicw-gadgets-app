<!doctype html>
<html>
<head><meta charset="utf-8"><title>AICW Gadgets</title>
<style>
  :root, html[data-aicw-style] {
    --ui-font-display: -apple-system, BlinkMacSystemFont, "Segoe UI Variable", "Segoe UI", Roboto, "Noto Sans", "Helvetica Neue", Arial, sans-serif;
    --ui-font-body: -apple-system, BlinkMacSystemFont, "Segoe UI Variable", "Segoe UI", Roboto, "Noto Sans", "Helvetica Neue", Arial, sans-serif;
    --dou: #2a2638; --glow: #ffe9a8;
  }
  body { font-family: var(--ui-font-body); }
  .ui-app { max-width: 980px; margin: 0 auto; }
  [hidden] { display: none !important; }

  /* header */
  .top { display: flex; align-items: center; gap: 14px; margin-bottom: 20px; }
  .top svg { width: 46px; height: 46px; flex: none; }
  .top h1 { margin: 0; font-size: clamp(20px, 2.4vw, 24px); font-weight: 700; letter-spacing: -.01em; }
  .top p { margin: 2px 0 0; color: var(--ui-muted-fg); font-size: 14px; }
  .top .grow { flex: 1; min-width: 0; }

  .tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--ui-border); margin-bottom: 22px; overflow-x: auto; }
  .tabs button { appearance: none; border: 0; background: none; color: var(--ui-muted-fg); font: inherit; font-size: 15px; padding: 10px 14px; border-bottom: 2px solid transparent; margin-bottom: -1px; cursor: pointer; white-space: nowrap; }
  .tabs button.on { color: var(--ui-fg); border-bottom-color: var(--ui-accent); font-weight: 600; }

  .btn { appearance: none; border: 1px solid var(--ui-border); background: var(--ui-surface); color: var(--ui-fg); font: inherit; font-size: 14.5px; font-weight: 550; padding: 10px 18px; border-radius: 12px; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; justify-content: center; }
  .btn:hover { border-color: color-mix(in srgb, var(--ui-accent) 50%, var(--ui-border)); }
  .btn.primary { background: var(--ui-accent); border-color: var(--ui-accent); color: var(--ui-accent-fg, #fff); }
  .btn.big { padding: 13px 24px; font-size: 15.5px; border-radius: 14px; }
  .btn.link { border: 0; background: none; padding: 4px 6px; color: var(--ui-accent); font-weight: 550; }
  .btn:disabled { opacity: .5; cursor: default; }
  .muted { color: var(--ui-muted-fg); }
  .small { font-size: 13px; }

  /* my gadgets */
  .head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 14px; flex-wrap: wrap; }
  .head h2 { margin: 0; font-size: 18px; font-weight: 650; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 280px), 1fr)); gap: 14px; }
  .g { border: 1px solid var(--ui-border); background: var(--ui-surface); border-radius: 18px; padding: 18px; display: flex; flex-direction: column; gap: 14px; }
  .g .who { display: flex; gap: 14px; align-items: center; }
  .g .who svg { width: 56px; height: 56px; flex: none; }
  .g .name { font-size: 16.5px; font-weight: 650; }
  .state { display: inline-flex; align-items: center; gap: 6px; font-size: 13.5px; color: var(--ui-muted-fg); margin-top: 3px; }
  .state i { width: 8px; height: 8px; border-radius: 50%; background: var(--ui-border); }
  .state.on i { background: var(--ui-good); box-shadow: 0 0 0 3px color-mix(in srgb, var(--ui-good) 20%, transparent); }
  .state.on { color: var(--ui-fg); }
  .g .meta { font-size: 13.5px; color: var(--ui-muted-fg); line-height: 1.5; }
  .g .meta b { color: var(--ui-fg); font-weight: 550; }
  .g .acts { display: flex; gap: 8px; flex-wrap: wrap; margin-top: auto; }
  .g .acts .btn { padding: 8px 14px; font-size: 13.5px; border-radius: 10px; }
  .g.ask { border-color: color-mix(in srgb, var(--ui-warn) 60%, var(--ui-border)); background: color-mix(in srgb, var(--ui-warn) 7%, var(--ui-surface)); }
  .add-tile { border: 1.5px dashed var(--ui-border); border-radius: 18px; min-height: 170px; display: grid; place-items: center; text-align: center; cursor: pointer; color: var(--ui-muted-fg); background: none; font: inherit; }
  .add-tile:hover { border-color: var(--ui-accent); color: var(--ui-accent); }
  .add-tile b { display: block; font-size: 16px; margin-top: 6px; }
  .add-tile .plus { font-size: 30px; line-height: 1; }
  .empty { text-align: center; padding: 44px 20px; border: 1px solid var(--ui-border); border-radius: 20px; background: var(--ui-surface); }
  .empty svg { width: 96px; height: 96px; }
  .empty h3 { margin: 14px 0 6px; font-size: 19px; }
  .empty p { margin: 0 auto 20px; max-width: 420px; color: var(--ui-muted-fg); line-height: 1.55; }
  .notice { display: flex; gap: 10px; align-items: center; padding: 12px 14px; border-radius: 14px; background: color-mix(in srgb, var(--ui-warn) 10%, var(--ui-surface)); border: 1px solid color-mix(in srgb, var(--ui-warn) 40%, var(--ui-border)); margin-bottom: 16px; font-size: 14px; }
  .notice .grow { flex: 1; }

  /* wizard */
  .wiz { position: fixed; inset: 0; background: var(--ui-bg); z-index: 50; overflow-y: auto; }
  .wiz-in { max-width: 560px; margin: 0 auto; padding: 22px 20px 40px; }
  .wiz-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
  .wiz-top b { font-size: 15px; }
  .dots { display: flex; gap: 6px; margin-bottom: 26px; }
  .dots i { flex: 1; height: 4px; border-radius: 4px; background: var(--ui-border); }
  .dots i.on { background: var(--ui-accent); }
  .pane { text-align: center; }
  .pane h2 { margin: 0 0 8px; font-size: clamp(20px, 3vw, 24px); font-weight: 700; letter-spacing: -.01em; }
  .pane > p { margin: 0 auto 22px; color: var(--ui-muted-fg); line-height: 1.55; max-width: 440px; font-size: 15px; }
  .art { width: 150px; height: 150px; margin: 6px auto 18px; position: relative; display: grid; place-items: center; }
  .art svg { width: 120px; height: 120px; }
  .pulse::before, .pulse::after { content: ''; position: absolute; inset: 10px; border-radius: 50%; border: 2px solid var(--ui-accent); opacity: 0; animation: ring 2.4s ease-out infinite; }
  .pulse::after { animation-delay: 1.2s; }
  @keyframes ring { 0% { transform: scale(.7); opacity: .6; } 100% { transform: scale(1.35); opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { .pulse::before, .pulse::after { animation: none; } }
  .found { display: flex; align-items: center; gap: 14px; text-align: left; padding: 14px 16px; border: 1.5px solid var(--ui-accent); border-radius: 16px; background: color-mix(in srgb, var(--ui-accent) 6%, var(--ui-surface)); margin: 0 0 12px; width: 100%; font: inherit; color: inherit; cursor: pointer; }
  .found svg { width: 44px; height: 44px; flex: none; }
  .found .grow { flex: 1; }
  .found b { font-size: 15.5px; display: block; }
  .alt { margin-top: 24px; padding: 16px; border-radius: 16px; border: 1px solid var(--ui-border); background: var(--ui-surface); text-align: left; font-size: 14px; line-height: 1.55; }
  .alt b { display: block; margin-bottom: 4px; font-size: 14.5px; }
  .bar { height: 8px; border-radius: 99px; background: var(--ui-border); overflow: hidden; margin: 18px 0 8px; }
  .bar span { display: block; height: 100%; width: 0; background: var(--ui-accent); transition: width .4s; }
  .press { font-size: 15px; font-weight: 600; padding: 12px 16px; border-radius: 14px; background: color-mix(in srgb, var(--ui-accent) 10%, var(--ui-surface)); display: inline-block; }
  .count { font-variant-numeric: tabular-nums; color: var(--ui-muted-fg); margin-top: 12px; font-size: 14px; }
  .nets { display: grid; gap: 8px; text-align: left; margin-bottom: 14px; max-height: 300px; overflow-y: auto; }
  .nets button { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border: 1px solid var(--ui-border); border-radius: 12px; background: var(--ui-surface); font: inherit; color: inherit; cursor: pointer; text-align: left; }
  .nets button.on { border-color: var(--ui-accent); box-shadow: 0 0 0 2px color-mix(in srgb, var(--ui-accent) 25%, transparent); }
  .nets button .grow { flex: 1; }
  .sig { display: inline-flex; gap: 2px; align-items: flex-end; height: 14px; }
  .sig i { width: 3px; background: var(--ui-border); border-radius: 1px; }
  .sig i.on { background: var(--ui-fg); }
  .fields { display: grid; gap: 12px; text-align: left; }
  .fields label span { display: block; font-size: 13.5px; color: var(--ui-muted-fg); margin-bottom: 6px; font-weight: 500; }
  .fields input, .fields select { width: 100%; font-size: 15.5px; padding: 12px 14px; border-radius: 12px; box-sizing: border-box; }
  .err { color: var(--ui-bad); font-size: 14px; margin-top: 10px; min-height: 20px; }
  .actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 22px; }
  .server { margin-top: 18px; font-size: 13.5px; color: var(--ui-muted-fg); }
  .check { width: 92px; height: 92px; border-radius: 50%; display: grid; place-items: center; background: color-mix(in srgb, var(--ui-good) 14%, transparent); color: var(--ui-good); font-size: 46px; margin: 4px auto 16px; }

  /* chat */
  .pick { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
  .pick button { appearance: none; border: 1px solid var(--ui-border); background: var(--ui-surface); color: inherit; font: inherit; font-size: 14px; padding: 7px 14px; border-radius: 999px; cursor: pointer; }
  .pick button.on { border-color: var(--ui-accent); background: color-mix(in srgb, var(--ui-accent) 10%, var(--ui-surface)); font-weight: 600; }
  .chat { border: 1px solid var(--ui-border); border-radius: 18px; background: var(--ui-surface); padding: 16px; min-height: 300px; max-height: min(60vh, 560px); overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
  .msg { max-width: 80%; padding: 10px 14px; border-radius: 16px; line-height: 1.5; font-size: 14.5px; white-space: pre-wrap; }
  .msg.user { align-self: flex-end; background: var(--ui-accent); color: var(--ui-accent-fg, #fff); border-bottom-right-radius: 4px; }
  .msg.assistant { align-self: flex-start; background: var(--ui-bg); border: 1px solid var(--ui-border); border-bottom-left-radius: 4px; }
  .chat .none { margin: auto; color: var(--ui-muted-fg); text-align: center; }

  /* settings */
  .sec { border: 1px solid var(--ui-border); border-radius: 18px; background: var(--ui-surface); padding: 18px 20px; margin-bottom: 14px; }
  .sec h3 { margin: 0 0 4px; font-size: 16px; font-weight: 650; }
  .sec > p { margin: 0 0 14px; color: var(--ui-muted-fg); font-size: 14px; line-height: 1.5; }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .codebox { display: flex; gap: 8px; align-items: center; padding: 10px 12px; border: 1px dashed var(--ui-border); border-radius: 12px; background: var(--ui-bg); }
  .codebox code { flex: 1; font-size: 12.5px; word-break: break-all; color: var(--ui-muted-fg); }
  details.adv summary { cursor: pointer; font-weight: 600; font-size: 15px; }
  details.adv[open] summary { margin-bottom: 12px; }
  .kv { display: grid; grid-template-columns: max-content 1fr; gap: 6px 14px; font-size: 13.5px; }
  .kv span:nth-child(odd) { color: var(--ui-muted-fg); }
  .sw { display: flex; gap: 12px; align-items: flex-start; padding: 10px 0; border-top: 1px solid var(--ui-border); font-size: 14px; }
  .sw input { margin-top: 3px; width: 17px; height: 17px; accent-color: var(--ui-accent); }
  .sw b { display: block; font-weight: 550; }
  dialog { border: 1px solid var(--ui-border); border-radius: 18px; padding: 22px; background: var(--ui-surface); color: var(--ui-fg); max-width: min(440px, 92vw); }
  dialog::backdrop { background: rgba(0,0,0,.35); }
  dialog h3 { margin: 0 0 6px; }
</style>
</head>
<body>
<div class="ui-app">
  <div class="top">
    <svg viewBox="0 0 200 210" id="logo"></svg>
    <div class="grow"><h1 data-t="AICW Gadgets|AICW Gadgets"></h1><p data-t="Talk to your AI assistant with a small device you hold in your hand.|Trò chuyện với trợ lý AI qua một thiết bị nhỏ cầm tay."></p></div>
  </div>
  <nav class="tabs">
    <button data-view="home" class="on" data-t="My gadgets|Gadget của tôi"></button>
    <button data-view="chat" data-t="Conversations|Hội thoại"></button>
    <button data-view="settings" data-t="Settings|Cài đặt"></button>
  </nav>

  <!-- My gadgets -->
  <section data-pane="home">
    <div id="askList"></div>
    <div id="emptyHome" class="empty" hidden>
      <svg viewBox="0 0 200 210" class="douArt"></svg>
      <h3 data-t="No gadget yet|Chưa có gadget nào"></h3>
      <p data-t="Add your first gadget. It takes about two minutes: we find it, you press its button, choose your Wi-Fi, done.|Thêm gadget đầu tiên, khoảng 2 phút: app tìm thiết bị, bạn bấm nút trên gadget, chọn Wi-Fi là xong."></p>
      <button class="btn primary big" data-add data-t="+ Add a gadget|+ Thêm gadget"></button>
    </div>
    <div id="homeList" hidden>
      <div class="head"><h2 data-t="My gadgets|Gadget của tôi"></h2><button class="btn primary" data-add data-t="+ Add a gadget|+ Thêm gadget"></button></div>
      <div class="grid" id="grid"></div>
    </div>
  </section>

  <!-- Conversations -->
  <section data-pane="chat" hidden>
    <div class="pick" id="chPick"></div>
    <div class="chat" id="chat"></div>
  </section>

  <!-- Settings -->
  <section data-pane="settings" hidden>
    <div class="sec">
      <h3 data-t="Assistant|Trợ lý"></h3>
      <p data-t="Who answers your gadgets, in which language and voice.|Ai trả lời gadget, nói ngôn ngữ nào, giọng nào."></p>
      <div class="fields" style="grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr))">
        <label><span data-t="Assistant|Trợ lý"></span><select class="ui-select" id="sAgent"></select></label>
        <label><span data-t="Language|Ngôn ngữ"></span><select class="ui-select" id="sLang"><option value="vi">Tiếng Việt</option><option value="en">English</option></select></label>
      </div>
      <div class="fields" style="margin-top:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr))">
        <div><span class="small muted" data-t="Listening|Nghe giọng nói"></span><div data-speech-picker="stt"></div></div>
        <div><span class="small muted" data-t="Speaking|Giọng đọc"></span><div data-speech-picker="tts"></div></div>
      </div>
      <div class="row" style="margin-top:16px"><button class="btn primary" id="sSave" data-t="Save|Lưu"></button><span class="muted small" id="sOut"></span></div>
    </div>

    <div class="sec">
      <h3 data-t="Use gadgets with another computer|Dùng gadget với máy tính khác"></h3>
      <p id="srvText"></p>
      <div id="srvSelf">
        <p class="small muted" style="margin:0 0 8px" data-t="To set gadgets up from another computer, copy this code there.|Muốn cài gadget từ máy khác cho máy này, sao chép mã này sang máy đó."></p>
        <div class="codebox"><code id="myCode"></code><button class="btn" id="cpCode" data-t="Copy|Sao chép"></button></div>
      </div>
      <div class="row" style="margin-top:12px"><button class="btn" id="bServer" data-t="Change|Đổi máy tính"></button><button class="btn link" id="bServerSelf" hidden data-t="Use this computer again|Dùng lại máy này"></button></div>
    </div>

    <div class="sec">
      <details class="adv">
        <summary data-t="Advanced|Nâng cao"></summary>
        <div class="kv" id="advKv"></div>
        <label class="sw"><input type="checkbox" id="sOpen"><div><b data-t="Accept new gadgets without asking|Nhận gadget lạ không cần hỏi"></b><span class="muted small" data-t="Leave off so a stranger's gadget cannot talk to your assistant.|Nên để tắt để gadget của người lạ không trò chuyện được với trợ lý của bạn."></span></div></label>
        <label class="sw"><input type="checkbox" id="sRelay"><div><b data-t="Reachable from anywhere|Kết nối từ mọi nơi"></b><span class="muted small" data-t="Through the AICW relay, end-to-end encrypted.|Qua relay AICW, mã hoá đầu-cuối."></span></div></label>
        <label class="sw"><input type="checkbox" id="sLan"><div><b data-t="Reachable on the same Wi-Fi|Kết nối trong cùng Wi-Fi"></b></div></label>
        <div class="row" style="margin-top:12px"><button class="btn" id="bRestart" data-t="Restart the connection|Khởi động lại kết nối"></button><button class="btn" id="bSaveAdv" data-t="Save|Lưu"></button></div>
      </details>
    </div>
  </section>
</div>

<!-- Add-a-gadget wizard -->
<div class="wiz" id="wiz" hidden>
  <div class="wiz-in">
    <div class="wiz-top"><b data-t="Add a gadget|Thêm gadget"></b><button class="btn link" id="wClose" data-t="Close|Đóng"></button></div>
    <div class="dots"><i></i><i></i><i></i><i></i></div>

    <!-- 1: find -->
    <div class="pane" data-step="find">
      <div class="art pulse"><svg viewBox="0 0 200 210" class="douArt"></svg></div>
      <h2 data-t="Turn your gadget on|Bật gadget lên"></h2>
      <p data-t="Keep it close to this computer. We are looking for it now.|Để gadget gần máy tính này. App đang tự tìm."></p>
      <div id="foundList"></div>
      <p class="muted small" id="findHint" data-t="Searching…|Đang tìm…"></p>
      <div class="alt" id="usbAlt">
        <b data-t="New gadget, never set up?|Gadget mới, chưa cài bao giờ?"></b>
        <span id="usbText" data-t="Plug it into this computer with a USB cable. We will install the AICW software for you, then continue here.|Cắm gadget vào máy tính bằng cáp USB. App sẽ cài phần mềm AICW cho gadget rồi tiếp tục ở đây."></span>
        <div id="usbBox" hidden style="margin-top:12px">
          <div class="row"><b id="usbName" style="margin:0;flex:1"></b><button class="btn primary" id="bFlash" data-t="Install AICW software|Cài phần mềm AICW"></button></div>
          <div class="bar" id="flashBar" hidden><span></span></div>
          <div class="small muted" id="flashNote"></div>
        </div>
      </div>
    </div>

    <!-- 2: confirm -->
    <div class="pane" data-step="confirm" hidden>
      <div class="art pulse"><svg viewBox="0 0 200 210" class="douArt"></svg></div>
      <h2 data-t="Press the button on the gadget|Bấm nút trên gadget"></h2>
      <p data-t="This proves the gadget is really yours. Press the big front button once.|Để chắc gadget đúng là của bạn. Bấm nút lớn phía trước một lần."></p>
      <div class="press" id="confirmText" data-t="Connecting…|Đang kết nối…"></div>
      <div class="count" id="countdown"></div>
    </div>

    <!-- 3: wifi -->
    <div class="pane" data-step="wifi" hidden>
      <h2 data-t="Choose a Wi-Fi for the gadget|Chọn Wi-Fi cho gadget"></h2>
      <p data-t="These are the networks the gadget can see. It needs 2.4 GHz Wi-Fi.|Đây là các mạng gadget bắt được. Gadget cần Wi-Fi 2.4 GHz."></p>
      <div class="nets" id="nets"></div>
      <div class="fields">
        <label id="ssidField" hidden><span data-t="Wi-Fi name|Tên Wi-Fi"></span><input class="ui-input" id="wSsid" maxlength="32" autocomplete="off"></label>
        <label><span data-t="Password|Mật khẩu"></span><input class="ui-input" id="wPass" type="password" maxlength="64" autocomplete="off"></label>
      </div>
      <div class="err" id="wErr"></div>
      <div class="actions"><button class="btn primary big" id="bConnect" data-t="Connect|Kết nối"></button></div>
      <div class="server" id="wServer"></div>
    </div>

    <!-- 4: working / done -->
    <div class="pane" data-step="joining" hidden>
      <div class="art pulse"><svg viewBox="0 0 200 210" class="douArt"></svg></div>
      <h2 id="joinTitle" data-t="Connecting to Wi-Fi…|Đang vào Wi-Fi…"></h2>
      <p data-t="This takes a few seconds.|Mất vài giây thôi."></p>
    </div>
    <div class="pane" data-step="done" hidden>
      <div class="check">✓</div>
      <h2 data-t="Your gadget is ready|Gadget đã sẵn sàng"></h2>
      <p data-t="It restarts by itself. Then press its button and say “Hello”.|Gadget tự khởi động lại. Sau đó bấm nút và nói “Xin chào” nhé."></p>
      <div class="fields">
        <label><span data-t="Give it a name|Đặt tên cho gadget"></span><input class="ui-input" id="dName" maxlength="40"></label>
        <label><span data-t="It talks to|Trò chuyện với"></span><select class="ui-select" id="dAgent"></select></label>
      </div>
      <div class="actions"><button class="btn primary big" id="bDone" data-t="Done|Xong"></button></div>
    </div>
    <div class="pane" data-step="fail" hidden>
      <h2 data-t="That did not work|Chưa được rồi"></h2>
      <p id="failText"></p>
      <div class="actions"><button class="btn primary" id="bRetry" data-t="Try again|Thử lại"></button><button class="btn" id="bFailClose" data-t="Close|Đóng"></button></div>
    </div>
  </div>
</div>

<dialog id="dlgServer">
  <h3 data-t="Use another computer|Dùng máy tính khác"></h3>
  <p class="muted small" data-t="Gadgets you set up here will talk to the assistant on that computer. On that computer open AICW Gadgets → Settings → Copy, then paste here.|Gadget cài từ máy này sẽ trò chuyện với trợ lý trên máy kia. Trên máy kia mở AICW Gadgets → Cài đặt → Sao chép, rồi dán vào đây."></p>
  <div class="fields"><label><span data-t="Computer name (for you)|Tên máy (để bạn nhớ)"></span><input class="ui-input" id="srvLabel" maxlength="60" data-tp="e.g. Office PC|vd Máy bàn ở văn phòng"></label>
  <label><span data-t="Code|Mã"></span><input class="ui-input" id="srvCode" maxlength="300"></label></div>
  <div class="err" id="srvErr"></div>
  <div class="actions"><button class="btn primary" id="srvSave" data-t="Use this computer|Dùng máy này"></button><button class="btn" id="srvCancel" data-t="Cancel|Huỷ"></button></div>
</dialog>

<script>
const $ = (s) => document.querySelector(s);
const vi = () => String(aicw.locale || navigator.language || '').toLowerCase().startsWith('vi');
const T = (s) => { const [en, v] = s.split('|'); return vi() && v ? v : en; };
function translate(root = document) {
  root.querySelectorAll('[data-t]').forEach((el) => { el.textContent = T(el.dataset.t); });
  root.querySelectorAll('[data-tp]').forEach((el) => { el.placeholder = T(el.dataset.tp); });
}
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const ago = (t) => { if (!t) return ''; const s = (Date.now() - t) / 1000; if (s < 60) return T('just now|vừa xong'); if (s < 3600) return Math.round(s / 60) + T(' min ago| phút trước'); if (s < 86400) return Math.round(s / 3600) + T(' h ago| giờ trước'); return new Date(t).toLocaleDateString(); };
const toast = (m, tone) => (aicw.ui && aicw.ui.toast ? aicw.ui.toast(m, tone) : console.log(m));
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

function dou(glow = '#ffe9a8', sleepy = false) {
  let d = ''; for (let i = 0; i <= 180; i++) { const a = i / 180 * Math.PI * 2, r = 80 + 1.8 * Math.cos(a * 18); d += (i ? 'L' : 'M') + (100 + Math.cos(a) * r).toFixed(1) + ' ' + (105 + Math.sin(a) * r).toFixed(1); }
  const eye = (x) => sleepy ? `<path d="M${x - 14} 94 Q${x} 104 ${x + 14} 94" stroke="${glow}" stroke-width="8" fill="none" stroke-linecap="round"/>` : (() => { let p = ''; for (let t = 0.6; t <= 8.4; t += 0.25) { const r = 17 * t / 8.4; p += (p ? 'L' : 'M') + (x + Math.cos(t) * r).toFixed(1) + ' ' + (92 + Math.sin(t) * r).toFixed(1); } return `<path d="${p}" stroke="${glow}" stroke-width="8" fill="none" stroke-linecap="round"/>`; })();
  return `<path d="${d}Z" fill="#2a2638" stroke="${glow}" stroke-width="7"/>${eye(77)}${eye(123)}`;
}

let S = { status: null, devices: [], agents: [{ id: 'main', name: 'main' }], target: null, code: '', chat: null };

// ---------- tabs ----------
function show(v) {
  document.querySelectorAll('[data-pane]').forEach((p) => (p.hidden = p.dataset.pane !== v));
  document.querySelectorAll('.tabs button').forEach((b) => b.classList.toggle('on', b.dataset.view === v));
  aicw.setState({ ...(aicw.getState() || {}), view: v });
  if (v === 'chat') loadChat();
  if (v === 'settings') loadServer();
}
document.querySelectorAll('.tabs button').forEach((b) => (b.onclick = () => show(b.dataset.view)));

// ---------- my gadgets ----------
const agentName = (id) => (S.agents.find((a) => a.id === id) || {}).name || id;
async function loadDevices() {
  const { devices } = await aicw.call('listDevices', {});
  S.devices = devices;
  const mine = devices.filter((d) => !d.pending && !d.blocked);
  const asks = devices.filter((d) => d.pending);
  $('#askList').innerHTML = asks.map((d) => `<div class="notice"><svg viewBox="0 0 200 210" style="width:34px;height:34px">${dou()}</svg><div class="grow"><b>${T('A new gadget wants to talk to your assistant|Một gadget lạ muốn trò chuyện với trợ lý')}</b><div class="small muted">${esc(d.name || 'Dou')} · ${esc(d.mac)}</div></div><button class="btn primary" data-allow="${esc(d.mac)}">${T('Allow|Cho phép')}</button><button class="btn" data-deny="${esc(d.mac)}">${T('Block|Chặn')}</button></div>`).join('');
  $('#askList').querySelectorAll('[data-allow]').forEach((b) => (b.onclick = () => aicw.call('updateDevice', { mac: b.dataset.allow, pending: false, blocked: false }).then(loadDevices)));
  $('#askList').querySelectorAll('[data-deny]').forEach((b) => (b.onclick = () => aicw.call('updateDevice', { mac: b.dataset.deny, pending: false, blocked: true }).then(loadDevices)));
  $('#emptyHome').hidden = mine.length > 0; $('#homeList').hidden = mine.length === 0;
  const def = S.status?.settings?.agent || 'main';
  $('#grid').innerHTML = mine.map((d) => {
    const on = !!d.online;
    return `<div class="g"><div class="who"><svg viewBox="0 0 200 210">${dou(on ? '#ffe9a8' : '#8b8799', !on)}</svg><div><div class="name">${esc(d.name || 'Dou')}</div>
      <div class="state ${on ? 'on' : ''}"><i></i>${on ? T('Ready to talk|Sẵn sàng trò chuyện') : T('Asleep or offline|Đang ngủ hoặc ngoại tuyến')}${!on && d.lastSeen ? ' · ' + ago(d.lastSeen) : ''}</div></div></div>
      <div class="meta">${T('Talks to|Trò chuyện với')} <b>${esc(agentName(d.agent || def))}</b>${d.lastTurnAt ? `<br>${T('Last chat|Lần nói gần nhất')}: ${ago(d.lastTurnAt)}` : ''}</div>
      <div class="acts"><button class="btn" data-chat="${esc(d.mac)}">${T('Conversation|Hội thoại')}</button><button class="btn" data-edit="${esc(d.mac)}">${T('Edit|Sửa')}</button><button class="btn link" data-del="${esc(d.mac)}">${T('Remove|Gỡ')}</button></div></div>`;
  }).join('') + `<button class="add-tile" data-add><div><div class="plus">+</div><b>${T('Add a gadget|Thêm gadget')}</b></div></button>`;
  $('#grid').querySelectorAll('[data-chat]').forEach((b) => (b.onclick = () => { S.chat = b.dataset.chat; show('chat'); }));
  $('#grid').querySelectorAll('[data-edit]').forEach((b) => (b.onclick = () => editGadget(b.dataset.edit)));
  $('#grid').querySelectorAll('[data-del]').forEach((b) => (b.onclick = async () => {
    const ok = aicw.ui?.confirm ? await aicw.ui.confirm(T('Remove this gadget? It will stop talking to your assistant until you add it again.|Gỡ gadget này? Gadget sẽ không trò chuyện được nữa cho tới khi thêm lại.')) : confirm('?');
    if (ok) aicw.call('removeDevice', { mac: b.dataset.del }).then(loadDevices);
  }));
  bindAdd();
}
async function editGadget(mac) {
  const d = S.devices.find((x) => x.mac === mac) || {};
  const name = prompt(T('Name|Tên gadget'), d.name || 'Dou');
  if (name === null) return;
  await aicw.call('updateDevice', { mac, name });
  loadDevices();
}
function bindAdd() { document.querySelectorAll('[data-add]').forEach((b) => (b.onclick = openWizard)); }

// ---------- add-a-gadget wizard ----------
const W = { step: null, scanning: false, picked: null, job: null, nets: [], ssid: '', usb: null, flashedMac: '', deadline: 0, tick: null, retry: false };
const ORDER = ['find', 'confirm', 'wifi', 'done'];
function step(name) {
  W.step = name;
  document.querySelectorAll('#wiz [data-step]').forEach((p) => (p.hidden = p.dataset.step !== name));
  const idx = { find: 0, confirm: 1, wifi: 2, joining: 2, done: 3, fail: 0 }[name] ?? 0;
  document.querySelectorAll('#wiz .dots i').forEach((d, i) => d.classList.toggle('on', i <= idx));
  if (name !== 'confirm') { clearInterval(W.tick); W.tick = null; }
}
function openWizard() {
  Object.assign(W, { picked: null, job: null, nets: [], ssid: '', usb: null, retry: false });
  $('#foundList').innerHTML = ''; $('#usbBox').hidden = true; $('#flashBar').hidden = true; $('#flashNote').textContent = '';
  $('#findHint').textContent = T('Searching…|Đang tìm…');
  $('#wiz').hidden = false; step('find'); findLoop();
}
function closeWizard() {
  W.scanning = false;
  if (W.job) aicw.call('bleAnswer', { job: W.job, cancel: true }).catch(() => {});
  $('#wiz').hidden = true; loadDevices().catch(() => {});
}
$('#wClose').onclick = closeWizard; $('#bFailClose').onclick = closeWizard;
$('#bRetry').onclick = () => { step('find'); findLoop(); };

async function findLoop() {
  if (W.scanning) return; W.scanning = true;
  let rounds = 0;
  while (W.scanning && W.step === 'find' && !$('#wiz').hidden) {
    rounds++;
    const [ble, usb] = await Promise.all([
      aicw.call('bleScan', { seconds: 4 }).catch((e) => ({ error: e.message, gadgets: [] })),
      aicw.call('usbPorts', {}).catch(() => ({ ports: [] })),
    ]);
    if (!W.scanning || W.step !== 'find') break;
    if (ble.error && /bluetooth/i.test(ble.error)) $('#findHint').textContent = T('Bluetooth is off on this computer. Turn it on to find gadgets.|Bluetooth trên máy tính đang tắt. Bật Bluetooth để tìm gadget.');
    else $('#findHint').textContent = ble.gadgets.length ? '' : rounds > 2 ? T('Still looking. A gadget that was set up before must be reset first: on the gadget open the menu → Reset pairing.|Vẫn đang tìm. Gadget đã cài trước đây cần đặt lại: trên gadget mở menu → Reset pairing.') : T('Searching…|Đang tìm…');
    renderFound(ble.gadgets || []);
    renderUsb(usb.ports || []);
    // A gadget we just flashed over USB: pick it as soon as it shows up over Bluetooth.
    if (W.flashedMac) { const g = (ble.gadgets || []).find((x) => x.name.toUpperCase().endsWith(W.flashedMac.slice(-6).toUpperCase())); if (g) { W.flashedMac = ''; pick(g); break; } }
    await sleep(800);
  }
  W.scanning = false;
}
function shortName(g) { const tail = (g.name.match(/-([0-9A-F]{4,6})$/i) || [])[1]; return 'Dou' + (tail ? ' ' + tail.slice(-4) : ''); }
function renderFound(list) {
  $('#foundList').innerHTML = list.map((g, i) => `<button class="found" data-i="${i}"><svg viewBox="0 0 200 210">${dou()}</svg><div class="grow"><b>${esc(shortName(g))}</b><span class="small muted">${g.rssi > -60 ? T('Right next to you|Ngay cạnh bạn') : g.rssi > -80 ? T('Nearby|Ở gần') : T('A bit far|Hơi xa')}</span></div><span class="btn primary">${T('Set up|Cài đặt')}</span></button>`).join('');
  $('#foundList').querySelectorAll('.found').forEach((b) => (b.onclick = () => pick(list[Number(b.dataset.i)])));
  $('#usbAlt').hidden = list.length > 0 && !W.usb;
}
async function renderUsb(ports) {
  const p = ports.find((x) => x.boards && x.boards.length) || ports[0];
  if (!p) { W.usb = null; $('#usbBox').hidden = true; return; }
  if (W.usb && W.usb.path === p.path) return;
  W.usb = p; $('#usbAlt').hidden = false;
  if (!S.boards) { try { S.boards = await aicw.call('boards', {}); } catch { S.boards = { boards: [] }; } }
  const list = (S.boards.boards || []).filter((b) => b.available && b.aicw !== 'port');
  const match = list.filter((b) => (p.boards || []).includes(b.id));
  W.usb.board = (match.find((b) => b.aicw === 'ready') || match[0] || {}).id;
  const label = (list.find((b) => b.id === W.usb.board) || {}).name;
  $('#usbBox').hidden = false;
  $('#usbName').textContent = label ? T(`Found: ${label}|Đã thấy: ${label}`) : T('A board is plugged in|Đã thấy bo mạch cắm USB');
  $('#bFlash').disabled = !W.usb.board;
  if (!W.usb.board) $('#flashNote').textContent = T('This board is not supported yet.|Bo mạch này chưa được hỗ trợ.');
}
$('#bFlash').onclick = async () => {
  const ok = aicw.ui?.confirm ? await aicw.ui.confirm(T('This replaces the software on the gadget. Continue?|Thao tác này thay phần mềm trên gadget. Tiếp tục?')) : true;
  if (!ok) return;
  W.scanning = false;
  $('#bFlash').disabled = true; $('#flashBar').hidden = false;
  try {
    const r = await aicw.jobs.run('flashGadget', { port: W.usb.path, board: W.usb.board }, { onProgress: (j) => {
      $('#flashBar span').style.width = Math.round((j.progress || 0) * 100) + '%';
      $('#flashNote').textContent = (j.progress || 0) < 0.06 ? T('Preparing…|Đang chuẩn bị…') : (j.progress || 0) > 0.95 ? T('Restarting the gadget…|Đang khởi động lại gadget…') : T(`Installing ${Math.round((j.progress || 0) * 100)}%|Đang cài ${Math.round((j.progress || 0) * 100)}%`);
    } });
    W.flashedMac = String(r.mac || W.usb.serial || '').replace(/[^0-9a-f]/gi, '');
    $('#flashNote').textContent = T('Installed. You can unplug the cable. Looking for the gadget…|Đã cài xong, có thể rút cáp. Đang tìm gadget…');
    W.usb = null;
    await sleep(4000); findLoop();
  } catch (e) {
    $('#flashNote').textContent = T('Could not install|Chưa cài được') + ': ' + e.message; $('#bFlash').disabled = false; findLoop();
  }
};

function pick(g) {
  W.scanning = false; W.picked = g;
  step('confirm');
  $('#confirmText').textContent = T('Connecting…|Đang kết nối…'); $('#countdown').textContent = '';
  startSetup();
}
async function startSetup() {
  try {
    const job = await aicw.jobs.start('bleSetup', { id: W.picked.id }, { onProgress: onSetupProgress });
    W.job = job.id;
    const r = await job.done;
    W.job = null;
    const mac = String(r.device?.mac || '').replace(/[^0-9a-f]/gi, '').toLowerCase();
    W.doneMac = mac;
    $('#dName').value = 'Dou ' + mac.slice(-4).toUpperCase();
    $('#dAgent').innerHTML = S.agents.map((a) => `<option value="${esc(a.id)}">${esc(a.name)}</option>`).join('');
    $('#dAgent').value = S.status?.settings?.agent || 'main';
    $('#dName').parentElement.parentElement.hidden = !r.self;
    step('done');
  } catch (e) {
    W.job = null;
    if (/Cancelled/.test(e.message) && $('#wiz').hidden) return;
    $('#failText').textContent = friendly(e.message);
    step('fail');
  }
}
function friendly(m) {
  if (/did not answer|dropped/i.test(m)) return T('The gadget went out of reach. Keep it close and try again.|Gadget ra khỏi tầm Bluetooth. Để gần máy hơn rồi thử lại.');
  if (/Hết giờ|timeout/i.test(m)) return T('Time ran out before the button was pressed. Try again and press the gadget button.|Hết giờ mà chưa thấy bấm nút. Thử lại và bấm nút trên gadget nhé.');
  return m;
}
function onSetupProgress(j) {
  let p = {}; try { p = JSON.parse(j.note || '{}'); } catch { return; }
  if (p.networks) W.nets = p.networks;
  if (p.step === 'pairing_confirm_required') {
    $('#confirmText').textContent = T('Press the button on the gadget now|Bấm nút trên gadget ngay bây giờ');
    W.deadline = Date.now() + 60000;
    clearInterval(W.tick);
    W.tick = setInterval(() => { const s = Math.max(0, Math.round((W.deadline - Date.now()) / 1000)); $('#countdown').textContent = T(`${s} seconds left|Còn ${s} giây`); }, 500);
  } else if (p.step === 'pairing_confirmed') {
    $('#confirmText').textContent = T('Confirmed ✓|Đã xác nhận ✓'); $('#countdown').textContent = '';
  } else if (p.step === 'need_wifi') {
    showWifi(p);
  } else if (p.step === 'wifi_connecting') {
    $('#joinTitle').textContent = T('Connecting to Wi-Fi…|Đang vào Wi-Fi…'); step('joining');
  } else if (p.step === 'wifi_connected') {
    $('#joinTitle').textContent = T('Connected. Saving…|Đã vào Wi-Fi. Đang lưu…');
  }
}
function bars(rssi) { const n = rssi > -55 ? 4 : rssi > -67 ? 3 : rssi > -78 ? 2 : 1; return `<span class="sig">${[1, 2, 3, 4].map((i) => `<i class="${i <= n ? 'on' : ''}" style="height:${i * 3 + 2}px"></i>`).join('')}</span>`; }
function showWifi(p) {
  step('wifi');
  const nets = []; const seen = new Set();
  for (const n of (p.networks && p.networks.length ? p.networks : W.nets)) if (n.ssid && !seen.has(n.ssid)) { seen.add(n.ssid); nets.push(n); }
  nets.sort((a, b) => b.rssi - a.rssi);
  const cur = p.ssid || W.ssid || (nets[0] || {}).ssid || '';
  W.ssid = cur;
  $('#nets').innerHTML = nets.slice(0, 12).map((n) => `<button data-ssid="${esc(n.ssid)}" class="${n.ssid === cur ? 'on' : ''}">${bars(n.rssi)}<span class="grow">${esc(n.ssid)}</span>${n.secure ? '🔒' : ''}</button>`).join('') + `<button data-ssid=""><span class="grow muted">${T('Other network…|Mạng khác…')}</span></button>`;
  $('#nets').querySelectorAll('button').forEach((b) => (b.onclick = () => {
    $('#nets').querySelectorAll('button').forEach((x) => x.classList.toggle('on', x === b));
    W.ssid = b.dataset.ssid; $('#ssidField').hidden = !!W.ssid; if (!W.ssid) $('#wSsid').focus(); else $('#wPass').focus();
  }));
  $('#ssidField').hidden = nets.length > 0;
  $('#wErr').textContent = p.reason === 'wrong_password' ? T(`Could not join “${p.ssid}”. The password looks wrong, type it again.|Không vào được “${p.ssid}”. Có vẻ sai mật khẩu, bạn gõ lại nhé.`)
    : p.reason === 'ssid_not_seen' ? T(`The gadget cannot see “${p.ssid}”. Pick a network from the list (2.4 GHz).|Gadget không thấy mạng “${p.ssid}”. Chọn một mạng trong danh sách (2.4 GHz).`) : '';
  $('#wPass').value = ''; $('#bConnect').disabled = false;
  $('#wServer').innerHTML = S.target && !S.target.self ? T(`The gadget will talk to the assistant on <b>${esc(S.target.label || 'another computer')}</b>.|Gadget sẽ trò chuyện với trợ lý trên <b>${esc(S.target.label || 'máy tính khác')}</b>.`) : T('The gadget will talk to the assistant on this computer.|Gadget sẽ trò chuyện với trợ lý trên máy tính này.');
  setTimeout(() => (W.ssid ? $('#wPass') : $('#wSsid')).focus(), 50);
}
$('#bConnect').onclick = async () => {
  const ssid = W.ssid || $('#wSsid').value.trim();
  if (!ssid) { $('#wErr').textContent = T('Choose a Wi-Fi first.|Chọn Wi-Fi trước nhé.'); return; }
  if (!W.job) return;
  $('#bConnect').disabled = true; $('#wErr').textContent = '';
  W.ssid = ssid;
  const password = $('#wPass').value; $('#wPass').value = '';
  try { await aicw.call('bleAnswer', { job: W.job, ssid, password }); $('#joinTitle').textContent = T('Connecting to Wi-Fi…|Đang vào Wi-Fi…'); step('joining'); }
  catch (e) { $('#wErr').textContent = e.message; $('#bConnect').disabled = false; }
};
$('#wPass').onkeydown = (e) => { if (e.key === 'Enter') $('#bConnect').click(); };
$('#bDone').onclick = async () => {
  if (W.doneMac) await aicw.call('updateDevice', { mac: W.doneMac, name: $('#dName').value.trim() || 'Dou', agent: $('#dAgent').value }).catch(() => {});
  closeWizard();
};

// ---------- conversations ----------
async function loadChat() {
  const list = S.devices.filter((d) => !d.pending && !d.blocked);
  if (!list.length) { $('#chPick').innerHTML = ''; $('#chat').innerHTML = `<div class="none">${T('Add a gadget first, then its conversations show here.|Thêm gadget trước, hội thoại sẽ hiện ở đây.')}</div>`; return; }
  if (!S.chat || !list.some((d) => d.mac === S.chat)) S.chat = (aicw.getState() || {}).chat || list[0].mac;
  if (!list.some((d) => d.mac === S.chat)) S.chat = list[0].mac;
  aicw.setState({ ...(aicw.getState() || {}), chat: S.chat });
  $('#chPick').innerHTML = list.map((d) => `<button data-mac="${esc(d.mac)}" class="${d.mac === S.chat ? 'on' : ''}">${esc(d.name || 'Dou')}</button>`).join('');
  $('#chPick').querySelectorAll('button').forEach((b) => (b.onclick = () => { S.chat = b.dataset.mac; loadChat(); }));
  $('#chat').innerHTML = `<div class="none">${T('Loading…|Đang tải…')}</div>`;
  try {
    const r = await aicw.call('channelHistory', { mac: S.chat, limit: 40 });
    const clean = (t) => t.replace(/^Transcription:\s*\n?/i, '').replace(/^"(.*)"$/s, '$1');
    $('#chat').innerHTML = r.messages.length ? r.messages.map((m) => `<div class="msg ${m.role}">${esc(clean(m.text))}</div>`).join('') : `<div class="none">${T('No conversation yet. Press the gadget button and talk.|Chưa có hội thoại. Bấm nút trên gadget và nói thử nhé.')}</div>`;
    $('#chat').scrollTop = 1e9;
  } catch (e) { $('#chat').innerHTML = `<div class="none">${esc(e.message)}</div>`; }
}

// ---------- settings ----------
async function loadStatus() {
  const st = await aicw.call('status', {});
  S.status = st;
  const s = st.settings, b = st.bridge || {};
  if (!document.activeElement?.closest('[data-pane="settings"]')) {
    $('#sAgent').innerHTML = S.agents.map((a) => `<option value="${esc(a.id)}">${esc(a.name)}</option>`).join('');
    $('#sAgent').value = s.agent; $('#sLang').value = s.language || 'vi';
    $('#sOpen').checked = !!s.open; $('#sRelay').checked = !!s.relay; $('#sLan').checked = !!s.lan;
  }
  const yes = T('working|đang chạy'), no = T('off|tắt');
  $('#advKv').innerHTML = [
    [T('Connection|Kết nối'), b.running ? T(`on since ${ago(b.startedAt)}|bật từ ${ago(b.startedAt)}`) : s.enabled === false ? no : T('starting|đang khởi động')],
    [T('From anywhere|Từ mọi nơi'), s.relay ? (b.relay === 'up' ? yes : T('connecting|đang kết nối')) : no],
    [T('Same Wi-Fi|Cùng Wi-Fi'), s.lan ? (String(b.lan).startsWith('up') ? `${yes} · ${(st.lanAddresses || []).map((a) => a + ':' + s.lanPort).join(', ')}` : String(b.lan || '…')) : no],
  ].map(([k, v]) => `<span>${esc(k)}</span><span>${esc(v)}</span>`).join('');
}
async function loadServer() {
  const r = await aicw.call('connectCode', {});
  S.target = r.target; S.code = r.code;
  $('#myCode').textContent = r.code;
  const self = !!r.target.self;
  $('#srvText').innerHTML = self ? T('Gadgets you add here talk to the assistant on <b>this computer</b>.|Gadget bạn thêm ở đây trò chuyện với trợ lý trên <b>máy tính này</b>.')
    : T(`Gadgets you add here talk to the assistant on <b>${esc(r.target.label || 'another computer')}</b>. This computer only sets them up.|Gadget bạn thêm ở đây trò chuyện với trợ lý trên <b>${esc(r.target.label || 'máy tính khác')}</b>. Máy này chỉ dùng để cài đặt.`);
  $('#srvSelf').hidden = !self; $('#bServerSelf').hidden = self;
}
$('#cpCode').onclick = () => { (aicw.copy || ((t) => navigator.clipboard.writeText(t)))(S.code); toast(T('Copied|Đã sao chép'), 'good'); };
$('#bServer').onclick = () => { $('#srvErr').textContent = ''; $('#srvCode').value = ''; $('#dlgServer').showModal(); };
$('#srvCancel').onclick = () => $('#dlgServer').close();
$('#srvSave').onclick = () => aicw.call('setTarget', { code: $('#srvCode').value, label: $('#srvLabel').value.trim() })
  .then(() => { $('#dlgServer').close(); toast(T('Saved|Đã lưu'), 'good'); loadServer(); })
  .catch((e) => ($('#srvErr').textContent = e.message));
$('#bServerSelf').onclick = () => aicw.call('setTarget', {}).then(loadServer);
$('#sSave').onclick = () => aicw.call('updateSettings', {
  agent: $('#sAgent').value, language: $('#sLang').value,
  sttEngine: window.AicwApp ? AicwApp.speechEngine('stt') : 'auto', ttsEngine: window.AicwApp ? AicwApp.speechEngine('tts') : 'auto',
}).then(() => { $('#sOut').textContent = T('Saved|Đã lưu'); setTimeout(() => ($('#sOut').textContent = ''), 3000); loadDevices(); }).catch((e) => toast(e.message, 'bad'));
$('#bSaveAdv').onclick = () => aicw.call('updateSettings', { open: $('#sOpen').checked, relay: $('#sRelay').checked, lan: $('#sLan').checked })
  .then(() => toast(T('Saved|Đã lưu'), 'good')).catch((e) => toast(e.message, 'bad'));
$('#bRestart').onclick = () => aicw.call('restartBridge', {}).then(() => toast(T('Restarting…|Đang khởi động lại…'))).catch((e) => toast(e.message, 'bad'));

// ---------- start ----------
document.querySelector('#logo').innerHTML = dou();
document.querySelectorAll('.douArt').forEach((s) => (s.innerHTML = dou()));
translate();
if (window.AicwApp && AicwApp.speechPicker) document.querySelectorAll('[data-speech-picker]').forEach((n) => { try { AicwApp.speechPicker(n, n.dataset.speechPicker); } catch (e) { console.warn(e); } });
async function refresh() { await Promise.all([loadStatus().catch(() => {}), loadDevices().catch(() => {})]); }
aicw.call('agents', {}).then((r) => {
  S.agents = (r.agents || []).map((a) => (typeof a === 'string' ? { id: a, name: a } : a)).filter((a) => !/^(member-|aiapp-|okdb-live-|cskh-rehearsal$)/.test(a.id));
  refresh();
}).catch(() => refresh());
show((aicw.getState() || {}).view || 'home');
aicw.on('event:devices', () => loadDevices().catch(() => {}));
aicw.on('event:bridge', () => loadStatus().catch(() => {}));
aicw.on('visible', refresh);
setInterval(() => { if (aicw.visible !== false && $('#wiz').hidden) refresh(); }, 15000);
</script>
</body>
</html>
